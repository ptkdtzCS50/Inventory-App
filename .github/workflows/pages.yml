# Stellt die App als Preview über GitHub Pages bereit.
# Läuft bei jedem Push auf den Entwicklungsbranch und kann manuell
# gestartet werden (Actions → Deploy Preview → Run workflow).
name: Deploy Preview (GitHub Pages)

on:
  push:
    branches: [claude/device-fleet-management-96h4vw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pages einrichten (aktiviert Pages beim ersten Lauf automatisch)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: App als Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
